name: homelab

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
    environment:
      - TZ=${TZ}

  # Grott runs as a proxy between the Growatt ShineWiFi/ShineLAN datalogger and
  # server.growatt.com, decoding the data and publishing it to MQTT.
  grott:
    image: ledidobe/grott:2.8.3_240731
    container_name: grott
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "5279:5279"
    volumes:
      - ./grott/grott.ini:/app/grott.ini:ro
      - ./grott/grott_ha.py:/app/grott_ha.py:ro
    environment:
      - TZ=${TZ}
      # Secrets come from .env; everything else lives in grott/grott.ini.
      - gmqttauth=True
      - gmqttuser=${MQTT_USER}
      - gmqttpassword=${MQTT_PASSWORD}
      - 'gextvar={"ha_mqtt_host": "mosquitto", "ha_mqtt_port": 1883, "ha_mqtt_user": "${MQTT_USER}", "ha_mqtt_password": "${MQTT_PASSWORD}"}'

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    volumes:
      - ./data/homeassistant:/config
      # Versioned config from this repo (fixed vs dynamic contract tracking, see docs/smart-meter.md)
      - ./homeassistant/packages:/config/packages:ro
      - ./homeassistant/custom_templates:/config/custom_templates:ro
      - ./homeassistant/dashboards:/config/dashboards:ro
      - ./homeassistant/www:/config/www:ro   # custom cards, served as /local/
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      # P1 smart meter cable (FTDI, DSMR 4.2, 115200 8N1). In the DSMR integration use /dev/ttyUSB0.
      - /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1BSZKI8-if00-port0:/dev/ttyUSB0
    environment:
      - TZ=${TZ}

  # OpenThread Border Router on the Home Assistant Connect ZBT-2 (OpenThread RCP firmware).
  # Same code as the official Home Assistant OTBR add-on, packaged as a standalone container.
  # REST API on :8081 for the Home Assistant "OpenThread Border Router" integration.
  otbr:
    image: ghcr.io/ownbee/hass-otbr-docker:v0.4.0
    container_name: otbr
    restart: unless-stopped
    network_mode: host
    privileged: true      # creates wpan0 and sets ip6tables/ipset rules on the host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_B81F3FD18AD8-if00:/dev/ttyACM0
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data/otbr:/data/thread
    environment:
      - TZ=${TZ}
      - DEVICE=/dev/ttyACM0
      - BAUDRATE=460800
      - FLOW_CONTROL=1
      - BACKBONE_IF=eth0
      - FIREWALL=1
      - NAT64=1
      - AUTOFLASH_FIRMWARE=0   # the ZBT-2 is flashed manually, see docs/matter-thread.md
      - OTBR_REST_PORT=8081
      - OTBR_WEB_PORT=8083
      - OTBR_LOG_LEVEL=notice

  # Matter server (matter.js; drop-in successor of python-matter-server). WebSocket on :5580,
  # used by the Home Assistant Matter integration (ws://localhost:5580/ws).
  matter-server:
    image: ghcr.io/matter-js/matterjs-server:1.6.0
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/matter-server:/data
    environment:
      - TZ=${TZ}
      - PRIMARY_INTERFACE=eth0

  # HTTPS reverse proxy for Home Assistant: Cast devices (Nest Hub) load the
  # HA Cast receiver over HTTPS, so HA must be reachable via HTTPS with a valid cert, see docs/https.md.
  # Host network: listens on 443 (and 80 for redirects), proxies to Home Assistant on localhost:8123.
  caddy:
    build: ./caddy
    image: homelab-caddy:2.10.2-duckdns
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    environment:
      - TZ=${TZ}
      - HA_DOMAIN=${HA_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}

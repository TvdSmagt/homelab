<script src="../../homeassistant/www/homelab-ambient-panel.js"></script></head><body>
<script>
const st = (state, attributes = {}) => ({ state: String(state), attributes });
const states = {

  'sensor.koekelberg25_outdoor_temperature': st(10.4),

const now = Date.now()/1000;

const hour0 = Math.floor(Date.now() / 3600e3) * 3600e3, noon0 = new Date().setHours(12, 0, 0, 0);

  callService: (...a) => console.log('svc', JSON.stringify(a)),

        v += 0.25 * Math.max(0, Math.sin(i / 3.5)) + 0.05; return { lu: t, s: String(v.toFixed(3)) }; }).filter((r) => r.lu < now) }; }
    if (m.type.startsWith('history')) return { 'sensor.6fz463602f_pv_output_actual': hist(t => Math.max(0, Math.sin((t-0.25)*Math.PI*1.6))*2600),

    };
    const out = {};
    for (const id of m.statistic_ids) out[id] = Array.from({length: n}, (_, i) => { const t = t0 + i*step, h = new Date(t).getHours(); const per = (m.period === 'hour' && /energy_total|import_total|export_total/.test(id) ? 12 : 1) * (0.6 + 0.4 * Math.sin(Math.floor(i * step / 86400e3) * 2.1) ** 2); // energy per hour, varies per day
      const v = f[id] ? f[id](h, i) * (/price/.test(id) ? 1 : per) : 0; return {start: t, change: v, mean: v, max: id === 'sensor.house_power' && i % 9 === 0 ? v + 1400 : v * 1.25}; });
    return out;
  } };

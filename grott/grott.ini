# Grott configuration. Secrets (MQTT credentials) are injected via environment
# variables from .env, see compose.yaml. Full reference:
# https://github.com/johanmeijer/grott/blob/master/examples/grott.ini

[Generic]
mode = proxy
ip = 0.0.0.0
port = 5279
verbose = False
# Set to True to block commands from server.growatt.com / ShinePhone app to the inverter.
blockcmd = False
time = auto
sendbuf = True
compat = False
# Inverter type: default / sph / spf / max / tl3 / ... (default works for most single-phase MIN/MIC inverters)
invtype = default

[Growatt]
ip = server.growatt.com
port = 5279

[MQTT]
nomqtt = False
ip = mosquitto
port = 1883
topic = energy/growatt
retain = False

[PVOutput]
pvoutput = False

[influx]
influx = False

[extension]
# Publishes Home Assistant MQTT auto-discovery config for every inverter (grott_ha.py,
# vendored from grott/examples/Home Assistent). extvar is set via env in compose.yaml.
extension = True
extname = grott_ha

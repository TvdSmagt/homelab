# Ambient home screen for the Nest Hub (1024x600, touch), cast by the automation in
# packages/nest_display.yaml. Docs: docs/nest-display.md.
#
#   thuis    the full-screen panel: one custom element with its own design, no HA cards
#            (homeassistant/www/homelab-ambient-panel.js). This is the view that gets cast.
#   kaarten  the earlier version built from HA cards, kept as a fallback
#            (homeassistant/www/homelab-energy-card.js).
title: Nest Hub
views:
  - title: Thuis
    path: thuis
    type: panel
    cards:
      - type: custom:homelab-ambient-panel

  - title: Kaarten
    path: kaarten
    type: panel
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          # ── Column 1: time, current weather, rain next 2 hours, scenes ──────────────────────────────
          - type: vertical-stack
            cards:
              - type: clock
                clock_size: large
              - type: weather-forecast
                entity: weather.forecast_home
                show_current: true
                show_forecast: false
              - type: custom:homelab-rain-card
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: sensor.solar_forecast_today
                    name: Zon vandaag
                    icon: mdi:weather-sunny
                    color: amber
                  - type: tile
                    entity: sensor.solar_forecast_tomorrow
                    name: Zon morgen
                    icon: mdi:weather-sunny-alert
                    color: amber
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: button
                    entity: scene.beneden_relax
                    name: Relax
                    icon: mdi:sofa
                    show_state: false
                    tap_action:
                      action: toggle
                  - type: button
                    entity: scene.beneden_dimmed
                    name: Gedimd
                    icon: mdi:weather-night
                    show_state: false
                    tap_action:
                      action: toggle
                  - type: button
                    entity: scene.beneden_bright
                    name: Fel
                    icon: mdi:white-balance-sunny
                    show_state: false
                    tap_action:
                      action: toggle
                  - type: button
                    entity: light.beneden
                    name: Uit
                    icon: mdi:power
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_off
                      target:
                        entity_id: light.beneden

          # ── Column 2: power widget (flow, energy score, 12 h graph, today's totals) ─────
          - type: custom:homelab-energy-flow-card

          # ── Column 3: all rooms (tap - / +), lights (tap toggles) ─────────────────
          - type: vertical-stack
            cards:
              - type: custom:homelab-climate-card
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: light.woonkamer_woonkamer
                    name: Woonkamer
                    tap_action:
                      action: toggle
                  - type: tile
                    entity: light.keuken_keuken
                    name: Keuken
                    tap_action:
                      action: toggle
                  - type: tile
                    entity: light.eetkamer_eetkamer
                    name: Eetkamer
                    tap_action:
                      action: toggle
                  - type: tile
                    entity: light.bibliotheek_bibliotheek
                    name: Bibliotheek
                    tap_action:
                      action: toggle
